<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:;" />
    <title>Starting DeepSeek Harness…</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        height: 100%;
        margin: 0;
        background: radial-gradient(1200px 600px at 50% 20%, #1b2130 0%, #0f1115 60%, #0b0d11 100%);
        color: #e6e8ee;
        font-family: system-ui, -apple-system, "Segoe UI", Cantarell, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        text-align: center;
        padding: 32px;
      }
      .mark {
        width: 76px;
        height: 76px;
        border-radius: 20px;
        background: linear-gradient(145deg, #3b82f6, #6366f1 55%, #8b5cf6);
        display: grid;
        place-items: center;
        font-size: 34px;
        font-weight: 700;
        color: #fff;
        box-shadow: 0 12px 40px rgba(59, 130, 246, 0.28);
        animation: breathe 2.6s ease-in-out infinite;
      }
      @keyframes breathe {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-3px) scale(1.03); }
      }
      h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: 0.2px; }
      p { margin: 0; color: #98a2b6; font-size: 14px; max-width: 460px; line-height: 1.55; }
      .bar {
        width: 232px;
        height: 4px;
        border-radius: 999px;
        background: #232838;
        overflow: hidden;
        position: relative;
      }
      .bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, #60a5fa, #a78bfa, transparent);
        animation: slide 1.25s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(320%); }
      }
      .hint { font-size: 12px; color: #667085; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark">DS</div>
      <h1>Starting DeepSeek Harness</h1>
      <div class="bar"></div>
      <p>Booting the local harness runtime and opening your session.</p>
      <p class="hint">First launch after an update can take a little longer.</p>
    </div>
  </body>
</html>
